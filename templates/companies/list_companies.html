{% extends 'base.html' %}
{% block content %}
    <h1>Companies</h1>
    <p><a href="{{ url_for('companies.create_company') }}">Create New Company</a></p>
    <ul>
        {% for company in companies %}
        <li>
            <a href="{{ url_for('companies.view_company', company_id=company.id) }}">{{ company.name }}</a> ({{ company.industry if company.industry else 'N/A' }})
            - <a href="{{ url_for('companies.edit_company', company_id=company.id) }}">Edit</a>
            - <form method="post" action="{{ url_for('companies.delete_company', company_id=company.id) }}" style="display:inline;">
                  <input type="submit" value="Delete" onclick="return confirm('Are you sure? This might affect associated contacts.');">
              </form>
        </li>
        {% else %}
        <li>No companies found.</li>
        {% endfor %}
    </ul>
{% endblock %}
